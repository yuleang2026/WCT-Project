services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nicc_smartspace}
      POSTGRES_USER: ${DB_USERNAME:-nicc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nicc_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nicc} -d ${DB_DATABASE:-nicc_smartspace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-nicc_smartspace}
      DB_USERNAME: ${DB_USERNAME:-nicc}
      DB_PASSWORD: ${DB_PASSWORD:-nicc_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage/app
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/api/spaces') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  queue:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-nicc_smartspace}
      DB_USERNAME: ${DB_USERNAME:-nicc}
      DB_PASSWORD: ${DB_PASSWORD:-nicc_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  backend_storage:
